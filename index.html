<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Draft Night Availability</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap');

:root{
  --bg: #0c0f12;
  --panel: #14181d;
  --panel-2: #191e24;
  --line: #262c33;
  --text: #eef1f4;
  --muted: #8b949e;
  --gold: #ffb703;
  --green: #4cae76;
  --green-dim: rgba(76,174,118,0.15);
  --red: #e0524a;
  --red-dim: rgba(224,82,74,0.15);
  --amber: #f0a34c;
  --amber-dim: rgba(240,163,76,0.15);
  --redhat: #c8433c;
  --sumovich: #3d7fc9;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(circle at 15% 0%, rgba(255,183,3,0.05), transparent 40%),
    radial-gradient(circle at 85% 100%, rgba(61,127,201,0.06), transparent 45%),
    var(--bg);
  color:var(--text);
  font-family:'Inter',system-ui,sans-serif;
  min-height:100vh;
}
.wrap{max-width:920px;margin:0 auto;padding:16px 12px 90px;}
.mono{font-family:'JetBrains Mono',monospace;}
.display{font-family:'Bebas Neue',sans-serif; letter-spacing:0.04em;}
@media(min-width:640px){.wrap{padding:28px 18px 90px;}}

/* Scoreboard header */
.board{
  background:linear-gradient(180deg,#171b20,#0f1216);
  border:1px solid var(--line);
  border-radius:14px;
  padding:18px 16px;
  margin-bottom:16px;
  position:relative;
  overflow:hidden;
}
@media(min-width:640px){.board{padding:22px 24px; margin-bottom:26px;}}
.board::before{
  content:'';
  position:absolute; inset:0;
  background: repeating-linear-gradient(180deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 3px);
  pointer-events:none;
}
.board-eyebrow{
  font-family:'JetBrains Mono',monospace;
  font-size:10px; letter-spacing:0.16em; text-transform:uppercase;
  color:var(--gold); margin:0 0 6px;
}
.board-title{
  font-size:30px; line-height:1.02; margin:0;
  color:var(--text);
}
@media(min-width:640px){.board-title{font-size:44px;}}
.board-sub{
  margin:8px 0 0; color:var(--muted); font-size:12.5px; line-height:1.4;
}
@media(min-width:640px){.board-sub{font-size:14px;}}
.league-tag{
  display:inline-block; margin-top:12px; padding:4px 12px;
  border-radius:100px; font-size:12px; font-weight:600;
  letter-spacing:0.03em;
}
.league-tag.redhat{background:rgba(200,67,60,0.18); color:#ff8b83; border:1px solid rgba(200,67,60,0.4);}
.league-tag.sumovich{background:rgba(61,127,201,0.18); color:#8ec0f5; border:1px solid rgba(61,127,201,0.4);}

/* Player nameplate - prominent when a member is in context */
.player-badge{
  margin-top:14px; padding-top:14px; border-top:1px solid var(--line);
  display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;
}
.player-badge .player-label{
  font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:0.12em;
  text-transform:uppercase; color:var(--muted);
}
.player-badge .player-name{
  font-family:'Bebas Neue',sans-serif; font-size:32px; letter-spacing:0.02em;
  line-height:1; color:var(--gold);
}
@media(min-width:640px){.player-badge .player-name{font-size:40px;}}

/* Nav */
.nav{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px;}
.nav button{
  background:var(--panel); color:var(--muted); border:1px solid var(--line);
  padding:12px 16px; border-radius:10px; font-size:14px; cursor:pointer;
  font-family:'Inter',sans-serif; font-weight:600;
  transition:all .15s ease; min-height:46px;
}
.nav button:hover, .nav button:active{color:var(--text); border-color:#3a4149;}
@media(max-width:480px){.nav button{flex:1 1 auto;}}

/* League pick */
.league-grid{display:grid; grid-template-columns:1fr; gap:14px;}
@media(min-width:600px){.league-grid{grid-template-columns:1fr 1fr;}}
.league-card{
  background:var(--panel); border:1px solid var(--line); border-radius:14px;
  padding:24px 20px; text-align:left; cursor:pointer; color:var(--text);
  transition:transform .15s ease, border-color .15s ease, background .15s ease;
  position:relative; overflow:hidden; min-height:84px; width:100%;
}
.league-card:hover, .league-card:active{transform:translateY(-2px); border-color:#3a4149; background:var(--panel-2);}
.league-card .bar{position:absolute; left:0; top:0; bottom:0; width:5px;}
.league-card.redhat .bar{background:var(--redhat);}
.league-card.sumovich .bar{background:var(--sumovich);}
.league-card h3{font-family:'Bebas Neue',sans-serif; font-size:30px; letter-spacing:0.03em; margin:0 0 4px;}
.league-card p{margin:0; color:var(--muted); font-size:13.5px;}

/* Name list */
.name-grid{display:grid; grid-template-columns:1fr; gap:10px; margin-top:6px;}
@media(min-width:560px){.name-grid{grid-template-columns:1fr 1fr;}}
.name-btn{
  background:var(--panel); border:1px solid var(--line); border-radius:12px;
  padding:16px 18px; text-align:left; color:var(--text); cursor:pointer;
  font-size:17px; font-weight:600; transition:all .15s ease;
  display:flex; align-items:center; justify-content:space-between;
  min-height:56px; width:100%;
}
.name-btn:hover, .name-btn:active{border-color:var(--gold); background:var(--panel-2);}
.name-btn .chip{font-size:10px; color:var(--muted); font-family:'JetBrains Mono',monospace;}

.section-label{
  font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.14em;
  text-transform:uppercase; color:var(--muted); margin:26px 0 10px;
}

.board-link{
  margin-top:22px; width:100%; text-align:center; background:none;
  border:1px dashed var(--line); color:var(--gold); padding:16px; border-radius:12px;
  cursor:pointer; font-size:15px; font-weight:700; font-family:'Inter',sans-serif;
  min-height:52px;
}
.board-link:hover, .board-link:active{border-color:var(--gold); background:rgba(255,183,3,0.06);}

/* Calendar */
.privacy-note{
  background:var(--panel); border:1px solid var(--line); border-radius:10px;
  padding:12px 14px; font-size:12.5px; color:var(--muted); margin-bottom:16px; line-height:1.45;
}
.privacy-note b{color:var(--text);}
.weekday-row{display:none;}
.cal-grid{display:flex; flex-direction:column; gap:10px;}
.cal-cell{min-height:0;}
.cal-cell.empty-cell{display:none;}
.day-card{
  background:var(--panel); border:1px solid var(--line); border-radius:12px;
  padding:12px 14px; display:flex; flex-direction:column; gap:10px;
  transition:border-color .15s ease;
}
.day-card.st-available{border-color:rgba(76,174,118,0.55); background:linear-gradient(180deg, var(--green-dim), var(--panel) 60%);}
.day-card.st-unavailable{border-color:rgba(224,82,74,0.5); background:linear-gradient(180deg, var(--red-dim), var(--panel) 60%);}
.day-card.st-maybe{border-color:rgba(240,163,76,0.5); background:linear-gradient(180deg, var(--amber-dim), var(--panel) 60%);}
.day-head{display:flex; align-items:baseline; gap:10px;}
.day-num{font-family:'Bebas Neue',sans-serif; font-size:26px; line-height:1;}
.day-wk{font-size:13px; color:var(--muted); font-weight:600;}
.day-month{font-size:10px; color:var(--muted); font-family:'JetBrains Mono',monospace; letter-spacing:0.08em; text-transform:uppercase;}
.day-badge{
  margin-left:auto; font-size:9.5px; font-family:'JetBrains Mono',monospace; letter-spacing:0.05em;
  color:var(--gold); text-transform:uppercase; background:rgba(255,183,3,0.1);
  padding:3px 8px; border-radius:100px; white-space:nowrap;
}
.status-row{display:flex; gap:8px;}
.status-btn{
  flex:1; border:1px solid var(--line); background:#0f1216; color:var(--muted);
  border-radius:10px; font-size:14px; font-weight:600; padding:12px 4px; cursor:pointer; line-height:1.1;
  transition:all .12s ease; min-height:50px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
}
.status-btn .ic{font-size:17px;}
.status-btn.active-available{background:var(--green); border-color:var(--green); color:#062712;}
.status-btn.active-unavailable{background:var(--red); border-color:var(--red); color:#2a0b09;}
.status-btn.active-maybe{background:var(--amber); border-color:var(--amber); color:#2a1a05;}
.time-row{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
.time-row select{
  width:100%; background:#0f1216; color:var(--text); border:1px solid var(--line);
  border-radius:8px; padding:10px 8px; font-size:15px; font-family:'JetBrains Mono',monospace;
  min-height:44px;
}
.time-lbl{font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:3px;}

/* Grid calendar layout for wider screens */
@media(min-width:680px){
  .weekday-row{display:grid; grid-template-columns:repeat(7,1fr); gap:8px; margin-bottom:8px;}
  .weekday-row div{text-align:center; font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--muted); letter-spacing:0.08em;}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:8px;}
  .cal-cell.empty-cell{display:block; visibility:hidden;}
  .day-card{min-height:150px; padding:10px 8px;}
  .day-head{flex-direction:column; align-items:flex-start; gap:0;}
  .day-wk{display:none;}
  .day-badge{margin-left:0; padding:2px 6px; font-size:8.5px;}
  .status-btn{padding:8px 0; min-height:0; flex-direction:row;}
  .status-btn .ic{font-size:13px;}
  .status-btn .lbl{display:none;}
  .time-row{grid-template-columns:1fr; gap:4px;}
  .time-row select{font-size:11px; padding:4px 4px; min-height:0;}
}

.save-bar{
  position:sticky; bottom:14px; margin-top:22px; display:flex; justify-content:center;
  z-index:5;
}
.save-btn{
  background:var(--gold); color:#241800; border:none; padding:16px 40px;
  border-radius:100px; font-size:16px; font-weight:800; cursor:pointer;
  box-shadow:0 8px 24px rgba(255,183,3,0.35); font-family:'Inter',sans-serif;
  letter-spacing:0.02em; width:100%; max-width:420px; min-height:54px;
}
.save-btn:hover, .save-btn:active{filter:brightness(1.06);}
.save-btn:disabled{opacity:0.7; cursor:default;}
.error-note{
  background:var(--red-dim); border:1px solid rgba(224,82,74,0.5); color:#f6a49e;
  padding:14px; border-radius:10px; font-size:13px; margin-top:16px; text-align:center;
  display:flex; flex-direction:column; align-items:center; gap:10px; line-height:1.4;
}
.retry-btn{
  background:none; border:1px solid rgba(224,82,74,0.6); color:#f6a49e;
  padding:10px 20px; border-radius:100px; font-size:13px; font-weight:700; cursor:pointer;
  min-height:40px; font-family:'Inter',sans-serif;
}
.retry-btn:hover, .retry-btn:active{background:rgba(224,82,74,0.12);}
.retry-row{display:flex; gap:8px; flex-wrap:wrap; justify-content:center;}
.copy-fallback{width:100%; margin-top:4px;}
.copy-fallback textarea{
  width:100%; min-height:180px; background:#0f1216; color:var(--text);
  border:1px solid rgba(224,82,74,0.4); border-radius:8px; padding:10px;
  font-family:'JetBrains Mono',monospace; font-size:12px; line-height:1.5;
}
.copy-confirm{color:#7bd6a3; font-size:12.5px; font-weight:600;}
.diag-box{
  width:100%; text-align:left; background:#0f1216; border:1px solid var(--line);
  border-radius:8px; padding:10px 12px; font-size:11.5px; font-family:'JetBrains Mono',monospace;
  color:var(--muted); line-height:1.6; word-break:break-word;
}
.diag-box b{color:var(--text);}
.manual-panel{
  background:var(--panel); border:1px solid var(--gold); border-radius:12px;
  padding:14px; margin-top:18px;
}
.manual-copy-help{margin:0 0 10px; color:var(--muted); font-size:12.5px; line-height:1.5;}
.retry-btn.manual{border-color:var(--gold); color:var(--gold);}
.retry-btn.manual:hover, .retry-btn.manual:active{background:rgba(255,183,3,0.1);}
.toast{
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
  background:var(--green); color:#062712; padding:12px 22px; border-radius:100px;
  font-weight:700; font-size:14px; box-shadow:0 8px 24px rgba(0,0,0,0.4);
  animation:fadeUp .25s ease;
}
@keyframes fadeUp{from{opacity:0; transform:translate(-50%,10px);} to{opacity:1; transform:translate(-50%,0);}}

/* Summary */
.top-strip{display:flex; gap:10px; overflow-x:auto; padding-bottom:6px; margin-bottom:22px;}
.top-card{
  flex:0 0 auto; min-width:118px; background:var(--panel); border:1px solid var(--gold);
  border-radius:10px; padding:12px 14px; text-align:center;
}
.top-card .rank{font-family:'JetBrains Mono',monospace; color:var(--gold); font-size:10px; letter-spacing:0.1em;}
.top-card .d{font-family:'Bebas Neue',sans-serif; font-size:24px; margin:2px 0;}
.top-card .score{font-size:11px; color:var(--muted); font-family:'JetBrains Mono',monospace;}

.table-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:12px;}
table.summary{border-collapse:collapse; width:100%; min-width:1100px;}
table.summary th, table.summary td{
  border-bottom:1px solid var(--line); border-right:1px solid var(--line);
  padding:8px 6px; font-size:11.5px; text-align:center; white-space:nowrap;
}
table.summary th{background:var(--panel-2); font-family:'JetBrains Mono',monospace; font-weight:500; color:var(--muted); font-size:10px;}
table.summary td.name-col, table.summary th.name-col{
  text-align:left; position:sticky; left:0; background:var(--panel-2); font-family:'Inter',sans-serif;
  font-weight:600; font-size:12.5px; padding-left:12px; z-index:1;
}
tr.you td{background:rgba(255,183,3,0.06);}
tr.you td.name-col{background:rgba(255,183,3,0.14); color:var(--gold); font-weight:800;}
.badge{display:inline-block; padding:3px 6px; border-radius:5px; font-size:10.5px; font-family:'JetBrains Mono',monospace;}
.badge.av{background:var(--green-dim); color:#7bd6a3;}
.badge.un{background:var(--red-dim); color:#f28c85;}
.badge.mb{background:var(--amber-dim); color:#f5c087;}
.badge.no{color:#4a5158;}

.loading{color:var(--muted); font-size:14px; padding:30px 0; text-align:center;}
.actions{display:flex; flex-direction:column; gap:10px; margin-top:22px;}
@media(min-width:560px){.actions{flex-direction:row; flex-wrap:wrap;}}
.actions button{
  background:var(--panel); border:1px solid var(--line); color:var(--text);
  padding:14px 18px; border-radius:10px; font-size:15px; cursor:pointer; font-weight:700;
  min-height:50px; width:100%;
}
@media(min-width:560px){.actions button{width:auto;}}
.actions button:hover, .actions button:active{border-color:var(--gold);}
.actions button.primary{background:var(--gold); color:#241800; border:none;}
footer{text-align:center; color:#4a5158; font-size:11px; margin-top:40px; font-family:'JetBrains Mono',monospace;}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
const LEAGUES = {
  redhat: {
    label: 'Red Hat League',
    accent: 'redhat',
    members: ["Adam Sawatzke","Andrew Balk","Andy Jessen","Andy Kaiser","Bryan Tamke","Ed Sumovich","Eric Pfeifer","Levi Oxford","Mark Woolley","Mike Woolley"]
  },
  sumovich: {
    label: 'Sumovich League',
    accent: 'sumovich',
    members: ["Adam Wagner","Andy Kaiser","Ben Wagner","Chase Moraczewski","Ed Sumovich","Jeff Schilke","Joe Meyer","Matt Stephany","Mike Joyce","Paul Kaiser","Randy Kush","Troy Kush"]
  }
};

const pad = n => String(n).padStart(2,'0');

function buildDays(){
  const days = [];
  const start = new Date(2026,7,27); // Aug 27 2026
  const end = new Date(2026,8,8);    // Sep 8 2026
  let d = new Date(start);
  while(d <= end){
    const dow = d.getDay();
    const isWeekend = dow === 0 || dow === 5 || dow === 6; // Fri, Sat, Sun
    const isLaborDay = dow === 1 && d.getMonth() === 8 && d.getDate() <= 7;
    days.push({
      dateStr: `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,
      date: d.getDate(),
      dow,
      monthLabel: d.toLocaleDateString('en-US',{month:'short'}),
      weekdayLabel: d.toLocaleDateString('en-US',{weekday:'short'}),
      isWeekend, isLaborDay,
      wideOpen: isWeekend || isLaborDay
    });
    d.setDate(d.getDate()+1);
  }
  return days;
}
const DAYS = buildDays();

function windowFor(day){
  return day.wideOpen ? {start:'08:00', end:'22:30'} : {start:'18:00', end:'22:00'};
}
function timeOptions(startHHMM, endHHMM){
  const opts = [];
  let [h,m] = startHHMM.split(':').map(Number);
  const [eh,em] = endHHMM.split(':').map(Number);
  while(h < eh || (h === eh && m <= em)){
    opts.push(`${pad(h)}:${pad(m)}`);
    m += 30;
    if(m >= 60){ m = 0; h++; }
  }
  return opts;
}
function fmtTime(hhmm){
  let [h,m] = hhmm.split(':').map(Number);
  const ampm = h >= 12 ? 'PM' : 'AM';
  let h12 = h % 12; if(h12 === 0) h12 = 12;
  return `${h12}:${pad(m)} ${ampm}`;
}
// Paste your deployed Google Apps Script Web App URL here (see setup instructions).
const CONFIG = {
  SHEET_URL: 'https://script.google.com/macros/s/AKfycbyudcoLTHnWHzQD_r8AxalvdVbyEM_K5TNSIHM_9mFaR42PHtiKjYRyBBAkJ4AnatAIzg/exec'
};

function keyFor(league, name){
  return `resp:${league}:${name.replace(/\s+/g,'_')}`;
}

function withRetry(fn, attempts=3, delayMs=400){
  return new Promise((resolve, reject) => {
    let tryNum = 0;
    const attempt = () => {
      tryNum++;
      Promise.resolve().then(fn).then(resolve).catch(err => {
        if(tryNum >= attempts){ reject(err); return; }
        setTimeout(attempt, delayMs * tryNum);
      });
    };
    attempt();
  });
}

async function sheetRequest(params, isPost){
  if(!CONFIG.SHEET_URL){
    const e = new Error('SETUP_NEEDED');
    e.setupNeeded = true;
    throw e;
  }
  return withRetry(async () => {
    let url = CONFIG.SHEET_URL;
    let opts = {};
    if(isPost){
      opts = { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(params) };
    } else {
      const qs = new URLSearchParams(params).toString();
      url += (url.includes('?') ? '&' : '?') + qs;
    }
    const res = await fetch(url, opts);
    const json = await res.json();
    if(!json.ok) throw new Error(json.error || 'Request failed');
    return json;
  });
}

async function sheetSave(league, name, data){
  return sheetRequest({ action:'save', league, name, data }, true);
}
async function sheetGetOne(league, name){
  const json = await sheetRequest({ action:'get', league, name }, false);
  return json.row;
}
async function sheetList(league){
  const json = await sheetRequest({ action:'list', league }, false);
  return json.rows || [];
}

const State = {
  screen: 'league',
  league: null,
  name: null,
  current: {}, // dateStr -> {status, earliest, latest}
  summary: null, // name -> {days, updatedAt}
  prevState: null,
  saveError: null,
  loadError: null,
  lastAttemptedPayload: null,
  copyStatus: null,
  copyText: null,
  diag: null
};

async function runDiagnostics(){
  State.diag = { running: true };
  render();
  const out = {};
  try{
    const url = CONFIG.SHEET_URL + (CONFIG.SHEET_URL.includes('?') ? '&' : '?') + 'action=list&league=redhat';
    const res = await fetch(url);
    let bodyPreview = '';
    try{ bodyPreview = (await res.text()).slice(0,150); }catch(_){}
    out.sheetTest = `Reached server — HTTP ${res.status}. Body starts: ${bodyPreview || '(empty)'}`;
  }catch(e){
    out.sheetTest = `FAILED — ${errText(e)}`;
  }
  try{
    const res2 = await fetch('https://jsonplaceholder.typicode.com/todos/1');
    out.genericTest = res2.ok ? 'SUCCESS — this browser can reach outside domains generally.' : `Reached server but got HTTP ${res2.status}.`;
  }catch(e){
    out.genericTest = `FAILED — ${errText(e)} (suggests ALL external network calls are blocked here, not just Google)`;
  }
  State.diag = { running: false, ...out };
  render();
}

function snapshot(){
  State.prevState = { screen: State.screen, league: State.league, name: State.name };
}
function goBack(){
  const prev = State.prevState;
  if(!prev){ backToLeagues(); return; }
  State.screen = prev.screen;
  State.league = prev.league;
  State.name = prev.name;
  State.prevState = null;
  State.saveError = null;
  render();
  if(State.screen === 'summary') loadSummary();
}

function setStatus(dateStr, status){
  const day = DAYS.find(d => d.dateStr === dateStr);
  const win = windowFor(day);
  const existing = State.current[dateStr] || {};
  if(status === 'unavailable'){
    State.current[dateStr] = {status};
  } else {
    State.current[dateStr] = {
      status,
      earliest: existing.earliest && timeOptions(win.start,win.end).includes(existing.earliest) ? existing.earliest : win.start,
      latest: existing.latest && timeOptions(win.start,win.end).includes(existing.latest) ? existing.latest : win.end
    };
  }
  render();
}
function setTime(dateStr, field, value){
  if(!State.current[dateStr]) return;
  State.current[dateStr][field] = value;
  if(field === 'earliest' && State.current[dateStr].earliest > State.current[dateStr].latest){
    State.current[dateStr].latest = State.current[dateStr].earliest;
  }
  if(field === 'latest' && State.current[dateStr].latest < State.current[dateStr].earliest){
    State.current[dateStr].earliest = State.current[dateStr].latest;
  }
  render();
}

async function pickLeague(league){
  snapshot();
  State.league = league;
  State.name = null;
  State.screen = 'name';
  render();
}

async function pickName(name){
  snapshot();
  State.name = name;
  State.current = {};
  State.saveError = null;
  State.copyStatus = null;
  try{
    const row = await sheetGetOne(State.league, name);
    if(row && row.data){ State.current = row.data; }
  }catch(e){
    if(!e.setupNeeded) console.error('Failed to load existing response:', e);
    // not fatal on load — they can still fill in and save
  }
  State.screen = 'calendar';
  render();
}

function errText(e){
  try{ return (e && (e.message || e.toString())) || 'Unknown error'; }catch(_){ return 'Unknown error'; }
}

function picksAsText(payload){
  if(!payload) return '';
  const league = LEAGUES[payload.league] ? LEAGUES[payload.league].label : payload.league;
  const lines = [`${payload.name} — ${league} availability (all times Central)`];
  DAYS.forEach(day => {
    const entry = payload.days ? payload.days[day.dateStr] : null;
    const dateLabel = `${day.weekdayLabel} ${day.monthLabel} ${day.date}`;
    if(!entry){ lines.push(`${dateLabel}: no answer yet`); return; }
    if(entry.status === 'unavailable'){ lines.push(`${dateLabel}: Not available`); return; }
    const word = entry.status === 'available' ? 'Available' : 'Maybe';
    const time = entry.earliest && entry.latest ? ` ${fmtTime(entry.earliest)}–${fmtTime(entry.latest)}` : '';
    lines.push(`${dateLabel}: ${word}${time}`);
  });
  return lines.join('\n');
}

async function copyToClipboard(text, successMsg){
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(text);
      State.copyStatus = successMsg;
      State.copyText = null;
    } else {
      throw new Error('Clipboard API unavailable');
    }
  }catch(e){
    State.copyStatus = 'SHOW_TEXTAREA';
    State.copyText = text;
  }
  render();
}

async function copyPicks(){
  const payload = State.lastAttemptedPayload || { name: State.name, league: State.league, days: State.current };
  const text = picksAsText(payload);
  if(!text) return;
  await copyToClipboard(text, 'Copied! Paste it into your group chat.');
}

function sheetHeaderRow(){
  return ['Name', ...DAYS.map(d => `${d.weekdayLabel} ${d.monthLabel} ${d.date}`)].join('\t');
}
function sheetDataRow(payload){
  if(!payload) return '';
  const cells = DAYS.map(day => {
    const entry = payload.days ? payload.days[day.dateStr] : null;
    if(!entry) return '';
    if(entry.status === 'unavailable') return 'Not available';
    const word = entry.status === 'available' ? 'Available' : 'Maybe';
    const time = entry.earliest && entry.latest ? ` ${fmtTime(entry.earliest)}–${fmtTime(entry.latest)}` : '';
    return `${word}${time}`;
  });
  return [payload.name, ...cells].join('\t');
}
async function copySheetHeader(){
  await copyToClipboard(sheetHeaderRow(), 'Copied! Paste into cell A1 of your Sheet (once, for the whole league).');
}
async function copySheetRow(){
  const text = sheetDataRow(State.lastAttemptedPayload || { name: State.name, league: State.league, days: State.current });
  if(!text) return;
  await copyToClipboard(text, 'Copied! Paste into the next empty row under the header, starting in column A.');
}

async function saveAndGoSummary(){
  const btn = document.getElementById('saveBtn');
  if(btn){ btn.disabled = true; btn.textContent = 'Saving…'; }
  State.saveError = null;
  State.copyStatus = null;
  const payload = { name: State.name, league: State.league, days: State.current };
  State.lastAttemptedPayload = payload;

  try{
    await sheetSave(State.league, State.name, State.current);
    snapshot();
    State.screen = 'summary';
    State._justSaved = true;
    render();
    await loadSummary();
    return;
  }catch(e){
    console.error('Save to Google Sheet failed:', e);
    if(e.setupNeeded){
      State.saveError = "The Google Sheet isn't connected yet — paste your Apps Script Web App URL into CONFIG.SHEET_URL near the top of the code.";
    } else {
      State.saveError = `Couldn't save to the Google Sheet (${errText(e)}). Your answers are still on this screen — try again, or copy them below to send manually.`;
    }
  }
  if(btn){ btn.disabled = false; btn.textContent = 'Save my availability'; }
  render();
}

async function goToSummary(){
  snapshot();
  State.screen = 'summary';
  State._justSaved = false;
  render();
  await loadSummary();
}

async function loadSummary(){
  try{
    const rows = await sheetList(State.league);
    const byName = {};
    rows.forEach(r => { byName[r.name] = { days: r.data || {}, updatedAt: r.updatedAt }; });
    State.summary = byName;
    State.loadError = null;
  }catch(e){
    console.error('Failed to load league board:', e);
    State.summary = {};
    State.loadError = e.setupNeeded
      ? "The Google Sheet isn't connected yet — paste your Apps Script Web App URL into CONFIG.SHEET_URL near the top of the code."
      : `Couldn't load the league board (${errText(e)}).`;
  }
  render();
}

function backToLeagues(){
  State.screen = 'league'; State.league = null; State.name = null; State.prevState = null; render();
}
function backToNames(){
  State.screen = 'name'; render();
}
function editMine(){
  snapshot();
  if(!State.name){ State.screen = 'name'; render(); return; }
  pickName(State.name);
}

function header(){
  const league = State.league ? LEAGUES[State.league] : null;
  return `
    <div class="board">
      <p class="board-eyebrow">// Draft Night Scheduler</p>
      <h1 class="board-title">FANTASY FOOTBALL AVAILABILITY</h1>
      <p class="board-sub">Aug 27 &ndash; Sep 8, 2026 &middot; weeknights 6:00&ndash;10:00 PM &middot; Fri, Sat, Sun & Labor Day open until 10:30 PM &middot; all times Central (CT)</p>
      ${league ? `<span class="league-tag ${league.accent}">${league.label}</span>` : ''}
      ${State.name ? `
        <div class="player-badge">
          <span class="player-label">Viewing as</span>
          <span class="player-name">${State.name}</span>
        </div>
      ` : ''}
    </div>
  `;
}

function navBar(){
  const btns = [];
  if(State.prevState) btns.push(`<button onclick="goBack()">&larr; Back</button>`);
  if(State.screen === 'calendar'){
    btns.push(`<button onclick="goToSummary()">View league board &rarr;</button>`);
  }
  if(State.screen === 'summary' && State.name){
    btns.push(`<button onclick="editMine()">Edit my availability</button>`);
  }
  return btns.length ? `<div class="nav">${btns.join('')}</div>` : '';
}

function renderLeagueScreen(){
  return `
    <div class="league-grid">
      <button class="league-card redhat" onclick="pickLeague('redhat')">
        <div class="bar"></div>
        <h3>Red Hat League</h3>
        <p>10 members</p>
      </button>
      <button class="league-card sumovich" onclick="pickLeague('sumovich')">
        <div class="bar"></div>
        <h3>Sumovich League</h3>
        <p>12 members</p>
      </button>
    </div>
  `;
}

function renderNameScreen(){
  const league = LEAGUES[State.league];
  return `
    <p class="section-label">Who are you?</p>
    <div class="name-grid">
      ${league.members.map(m => `<button class="name-btn" onclick="pickName('${m.replace(/'/g,"\\'")}')"><span>${m}</span><span class="chip">SET AVAILABILITY</span></button>`).join('')}
    </div>
    <button class="board-link" onclick="goToSummary()">View the whole ${league.label} board instead</button>
  `;
}

function renderCalendarScreen(){
  const leadingBlanks = DAYS[0].dow;
  const totalCells = leadingBlanks + DAYS.length;
  const trailingBlanks = (7 - (totalCells % 7)) % 7;

  let cells = '';
  for(let i=0;i<leadingBlanks;i++) cells += `<div class="cal-cell empty-cell"></div>`;
  DAYS.forEach(day => {
    const cur = State.current[day.dateStr];
    const status = cur ? cur.status : null;
    const win = windowFor(day);
    const opts = timeOptions(win.start, win.end);
    const stClass = status ? `st-${status}` : '';
    cells += `
      <div class="cal-cell">
        <div class="day-card ${stClass}">
          <div class="day-head">
            <span class="day-num">${day.date}</span>
            <span class="day-wk">${day.weekdayLabel}</span>
            <span class="day-month">${day.monthLabel}</span>
            ${day.isLaborDay ? `<div class="day-badge">Labor Day</div>` : (day.isWeekend ? `<div class="day-badge">Weekend</div>` : '')}
          </div>
          <div class="status-row">
            <button class="status-btn ${status==='available'?'active-available':''}" title="Available" onclick="setStatus('${day.dateStr}','available')"><span class="ic">&#10003;</span><span class="lbl">Available</span></button>
            <button class="status-btn ${status==='maybe'?'active-maybe':''}" title="Maybe" onclick="setStatus('${day.dateStr}','maybe')"><span class="ic">~</span><span class="lbl">Maybe</span></button>
            <button class="status-btn ${status==='unavailable'?'active-unavailable':''}" title="Not available" onclick="setStatus('${day.dateStr}','unavailable')"><span class="ic">&#10007;</span><span class="lbl">Can't</span></button>
          </div>
          ${ (status==='available'||status==='maybe') ? `
          <div class="time-row">
            <div>
              <div class="time-lbl">Earliest Start</div>
              <select onchange="setTime('${day.dateStr}','earliest',this.value)">
                ${opts.map(o => `<option value="${o}" ${cur.earliest===o?'selected':''}>${fmtTime(o)}</option>`).join('')}
              </select>
            </div>
            <div>
              <div class="time-lbl">Latest Start</div>
              <select onchange="setTime('${day.dateStr}','latest',this.value)">
                ${opts.map(o => `<option value="${o}" ${cur.latest===o?'selected':''}>${fmtTime(o)}</option>`).join('')}
              </select>
            </div>
          </div>` : '' }
        </div>
      </div>
    `;
  });
  for(let i=0;i<trailingBlanks;i++) cells += `<div class="cal-cell empty-cell"></div>`;

  return `
    <div class="privacy-note">Heads up &mdash; <b>your picks are saved to the league's shared Google Sheet</b> so everyone can find a night that works. Tap &#10003; available, ~ maybe, &#10007; not available for each day. <b>All times are Central (CT).</b></div>
    <div class="weekday-row"><div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div></div>
    <div class="cal-grid">${cells}</div>
    ${State.saveError ? `
      <div class="error-note">
        <div>${State.saveError}</div>
        <div class="retry-row">
          <button class="retry-btn" onclick="saveAndGoSummary()">Try again</button>
          <button class="retry-btn" onclick="runDiagnostics()">Diagnose connection</button>
        </div>
        ${State.diag ? `
          <div class="diag-box">
            ${State.diag.running ? 'Running tests…' : `
              <div><b>Your Sheet:</b> ${State.diag.sheetTest}</div>
              <div><b>Outside API:</b> ${State.diag.genericTest}</div>
            `}
          </div>
        ` : ''}
      </div>` : ''}
    <div class="manual-panel">
      <div class="section-label" style="margin-top:0;">Save it yourself (always works, no network needed)</div>
      <p class="manual-copy-help">Copy the header row once for the whole league, then everyone copies their own row and pastes it under it in the Sheet.</p>
      <div class="retry-row">
        <button class="retry-btn manual" onclick="copySheetHeader()">Copy header row</button>
        <button class="retry-btn manual" onclick="copySheetRow()">Copy my row</button>
        <button class="retry-btn manual" onclick="copyPicks()">Copy as plain text</button>
      </div>
      ${State.copyStatus === 'SHOW_TEXTAREA' ? `
        <div class="copy-fallback">
          <div class="time-lbl">Couldn't auto-copy &mdash; select the text below and copy it manually:</div>
          <textarea readonly onclick="this.select()">${State.copyText || ''}</textarea>
        </div>
      ` : (State.copyStatus ? `<div class="copy-confirm">${State.copyStatus}</div>` : '')}
    </div>
    <div class="save-bar"><button id="saveBtn" class="save-btn" onclick="saveAndGoSummary()">Try automatic save</button></div>
  `;
}

function scoreDay(dateStr){
  const members = LEAGUES[State.league].members;
  let score = 0, available = 0, maybe = 0, total = members.length;
  members.forEach(m => {
    const r = State.summary[m];
    const d = r && r.days ? r.days[dateStr] : null;
    if(d && d.status === 'available'){ score += 1; available++; }
    else if(d && d.status === 'maybe'){ score += 0.5; maybe++; }
  });
  return {score, available, maybe, total};
}

function renderSummaryScreen(){
  if(State.loadError){
    return `
      <div class="error-note">
        <div>${State.loadError}</div>
        <div class="retry-row">
          <button class="retry-btn" onclick="loadSummary()">Try again</button>
          <button class="retry-btn" onclick="runDiagnostics()">Diagnose connection</button>
        </div>
        ${State.diag ? `
          <div class="diag-box">
            ${State.diag.running ? 'Running tests…' : `
              <div><b>Your Sheet:</b> ${State.diag.sheetTest}</div>
              <div><b>Outside API:</b> ${State.diag.genericTest}</div>
            `}
          </div>
        ` : ''}
      </div>
    `;
  }
  if(!State.summary){
    return `<div class="loading">Loading the ${LEAGUES[State.league].label} board&hellip;</div>`;
  }
  const members = LEAGUES[State.league].members;

  const ranked = DAYS.map(d => ({day:d, ...scoreDay(d.dateStr)}))
    .sort((a,b) => b.score - a.score)
    .slice(0,5)
    .filter(r => r.score > 0);

  const topStrip = ranked.length ? `
    <p class="section-label">Best draft night options so far</p>
    <div class="top-strip">
      ${ranked.map((r,i) => `
        <div class="top-card">
          <div class="rank">#${i+1}</div>
          <div class="d">${r.day.monthLabel} ${r.day.date}</div>
          <div class="score">${r.available} in &middot; ${r.maybe} maybe / ${r.total}</div>
        </div>
      `).join('')}
    </div>
  ` : `<p class="section-label">No responses yet &mdash; be the first to set your availability</p>`;

  const rows = members.map(m => {
    const r = State.summary[m];
    const cells = DAYS.map(d => {
      const entry = r && r.days ? r.days[d.dateStr] : null;
      if(!entry) return `<td><span class="badge no">&ndash;</span></td>`;
      if(entry.status === 'unavailable') return `<td><span class="badge un">&#10007;</span></td>`;
      const time = entry.earliest && entry.latest ? `${fmtTime(entry.earliest)}&ndash;${fmtTime(entry.latest)}` : '';
      const cls = entry.status === 'available' ? 'av' : 'mb';
      const symbol = entry.status === 'available' ? '&#10003;' : '~';
      return `<td><span class="badge ${cls}">${symbol} ${time}</span></td>`;
    }).join('');
    return `<tr class="${m===State.name?'you':''}"><td class="name-col">${m}</td>${cells}</tr>`;
  }).join('');

  const headCells = DAYS.map(d => `<th>${d.weekdayLabel}<br>${d.monthLabel} ${d.date}</th>`).join('');

  return `
    ${topStrip}
    <p class="section-label">${LEAGUES[State.league].label} board <span style="color:var(--muted); text-transform:none; letter-spacing:0;">&middot; all times Central (CT)</span></p>
    <div class="table-wrap">
      <table class="summary">
        <thead><tr><th class="name-col">Member</th>${headCells}</tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <div class="actions">
      <button class="primary" onclick="editMine()">${State.name ? 'Edit my availability' : 'Set my availability'}</button>
      ${State.prevState ? `<button onclick="goBack()">&larr; Back</button>` : `<button onclick="backToNames()">Choose different person</button>`}
    </div>
  `;
}

function render(){
  const app = document.getElementById('app');
  let body = '';
  if(State.screen === 'league') body = renderLeagueScreen();
  else if(State.screen === 'name') body = renderNameScreen();
  else if(State.screen === 'calendar') body = renderCalendarScreen();
  else if(State.screen === 'summary') body = renderSummaryScreen();

  app.innerHTML = `
    ${header()}
    ${navBar()}
    ${body}
    <footer>DRAFT NIGHT SCHEDULER &middot; SYNCED TO YOUR LEAGUE'S GOOGLE SHEET</footer>
    ${State._justSaved ? `<div class="toast" id="toast">Saved &mdash; thanks!</div>` : ''}
  `;
  if(State._justSaved){
    setTimeout(() => { State._justSaved = false; const t = document.getElementById('toast'); if(t) t.remove(); }, 2600);
  }
}

render();
</script>
</body>
</html>
